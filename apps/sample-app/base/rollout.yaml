apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: sample-app
  labels:
    app: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: sample-app
          # This line gets automatically updated by the CI pipeline
          # (see sample-app/.github/workflows/ci.yml) after every
          # successful build - do not edit the tag by hand.
          image: 348258987583.dkr.ecr.eu-north-1.amazonaws.com/sample-app:5d6ea7416d0d9601f2e99df62996050d7be5b5e1
          env:
            - name: ROLLBACK_TEST
              value: "deliberately-triggering-failed-analysis"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: sample-app-health-check
        - setWeight: 50
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: sample-app-health-check
        - setWeight: 100